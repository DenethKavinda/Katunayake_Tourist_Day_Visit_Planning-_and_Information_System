<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Place Details - Katunayake Tourist Information System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .slideshow-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: -10; overflow: hidden;
    }
    .slide-track {
      display: flex; width: 400%; height: 100%;
      animation: slideLeftToRight 24s infinite ease-in-out;
    }
    .slide-track img { width: 25%; height: 100%; object-fit: cover; filter: brightness(0.9); }
    @keyframes slideLeftToRight {
      0%, 20% { transform: translateX(0%); }
      25%, 45% { transform: translateX(-25%); }
      50%, 70% { transform: translateX(-50%); }
      75%, 95% { transform: translateX(-75%); }
      100% { transform: translateX(0%); }
    }
    .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
    .glass-card { background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Background Image Slideshow -->
  <div class="slideshow-container">
    <div class="slide-track">
      <img src="https://images.unsplash.com/photo-1586861635167-e5223aadc9fe?auto=format&fit=crop&w=1920&q=80" alt="Katunayake Lagoon">
      <img src="https://images.unsplash.com/photo-1544644181-1484b3fdfc62?auto=format&fit=crop&w=1920&q=80" alt="Muthurajawela Marshlands">
      <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=1920&q=80" alt="Negombo Beach">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80" alt="Hamilton Canal">
    </div>
  </div>

  <!-- Shared Navigation Bar -->
  <header class="sticky top-0 z-50 glass-nav shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <a href="index.html" class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-500 to-emerald-400 flex items-center justify-center text-white font-bold text-xl shadow-md">K</div>
          <div>
            <span id="headerBrandTitle" class="text-xl font-black tracking-tight text-slate-900">Katunayake<span class="text-teal-600">Tourist</span></span>
            <span id="headerBrandSubtitle" class="block text-xs font-semibold text-slate-500 uppercase tracking-widest">Day-Visit Explorer</span>
          </div>
        </a>

        <nav class="hidden md:flex items-center space-x-1">
          <a href="index.html" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:text-teal-600 hover:bg-slate-100 rounded-lg flex items-center gap-2 transition">
            <i class="fa-solid fa-compass"></i> Places Listing
          </a>
          <a href="mapView.html" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:text-teal-600 hover:bg-slate-100 rounded-lg flex items-center gap-2 transition">
            <i class="fa-solid fa-map-location-dot"></i> Map View
          </a>
          <a href="visitPlanBuilder.html" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:text-teal-600 hover:bg-slate-100 rounded-lg flex items-center gap-2 transition relative">
            <i class="fa-solid fa-route"></i> Visit Plan Builder
            <span id="planBadge" class="hidden bg-teal-600 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
          </a>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <a href="index.html" class="inline-flex items-center gap-2 text-teal-700 font-bold text-sm mb-6 bg-white/80 px-4 py-2 rounded-xl shadow-sm hover:bg-white transition">
      <i class="fa-solid fa-arrow-left"></i> Back to Listing
    </a>

    <div id="detailsContainer" class="glass-card rounded-3xl overflow-hidden border border-white/80 shadow-lg">
      <!-- Dynamic details rendered via JavaScript -->
    </div>
  </main>

  <!-- Shared Footer -->
  <footer class="bg-slate-900 text-slate-400 py-10 mt-12 border-t border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center sm:text-left sm:flex sm:items-center sm:justify-between">
      <div>
        <span id="footerTitle" class="text-lg font-bold text-white">Katunayake Tourist Information System</span>
        <p id="footerDescription" class="text-xs text-slate-500 mt-1">Consolidated & verified local tourism data within a 25 km radius of CMB Airport.</p>
      </div>
      <div id="footerCopyright" class="mt-4 sm:mt-0 text-xs text-slate-500">
        &copy; 2026 Katunayake Tourism Board. Non-commercial day-trip planning system.
      </div>
    </div>
  </footer>

  <script src="/js/data.js"></script>
  <script>
    let currentPlace = null;

    function renderDetails(place) {
      currentPlace = place;
      const container = document.getElementById('detailsContainer');
      const isInPlan = isPlaceInPlan(place.id);

      container.innerHTML = `
        <div class="relative h-80 sm:h-96 w-full overflow-hidden">
          <img src="${place.image}" alt="${place.name}" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent flex items-end p-6 sm:p-8">
            <div>
              <span class="bg-teal-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-sm mb-2 inline-block">${place.category}</span>
              <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">${place.name}</h1>
              <p class="text-teal-200 text-xs sm:text-sm font-semibold mt-1"><i class="fa-solid fa-location-dot mr-1"></i> ${place.distanceKm} km from Katunayake CMB Airport</p>
            </div>
          </div>
        </div>

        <div class="p-6 sm:p-8 space-y-6">
          <div>
            <h2 class="text-lg font-extrabold text-slate-900 mb-2">Overview</h2>
            <p class="text-slate-600 leading-relaxed text-sm sm:text-base">${place.description}</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-slate-50 p-4 sm:p-6 rounded-2xl border border-slate-200/80">
            <div>
              <span class="block text-xs font-bold text-slate-400 uppercase">Opening Hours</span>
              <span class="text-sm font-extrabold text-slate-800">${place.hours}</span>
            </div>
            <div>
              <span class="block text-xs font-bold text-slate-400 uppercase">Entrance Fee</span>
              <span class="text-sm font-extrabold text-slate-800">${place.fee}</span>
            </div>
            <div>
              <span class="block text-xs font-bold text-slate-400 uppercase">Estimated Visit</span>
              <span class="text-sm font-extrabold text-slate-800">${place.duration}</span>
            </div>
          </div>

          <div>
            <h2 class="text-lg font-extrabold text-slate-900 mb-2">Traveler Tips</h2>
            <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-2xl text-xs sm:text-sm text-amber-900 leading-relaxed">
              <i class="fa-solid fa-lightbulb text-amber-600 mr-2"></i> ${place.tips || 'Plan your visit ahead and carry local currency for admission.'}
            </div>
          </div>

          <div class="pt-4 flex flex-wrap gap-4 border-t border-slate-200">
            <button onclick="togglePlanFromDetails(${place.id})" class="px-6 py-3 ${isInPlan ? 'bg-red-600 hover:bg-red-700' : 'bg-teal-600 hover:bg-teal-700'} text-white font-bold rounded-xl text-sm shadow-md transition flex items-center gap-2">
              <i class="fa-solid ${isInPlan ? 'fa-minus' : 'fa-plus'}"></i> ${isInPlan ? 'Remove from Visit Plan' : 'Add to Visit Plan'}
            </button>
            <a href="mapView.html?focus=${place.id}" class="px-6 py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl text-sm shadow-md transition flex items-center gap-2">
              <i class="fa-solid fa-map"></i> View Location on Map
            </a>
          </div>
        </div>
      `;
    }

    function togglePlanFromDetails(id) {
      let plan = getStoredPlan();
      if (plan.includes(id)) {
        plan = plan.filter(item => item !== id);
      } else {
        plan.push(id);
      }
      savePlan(plan);
      renderDetails(currentPlace);
      updatePlanBadge();
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await loadSiteSettings();
      await loadPlacesData();
      
      const urlParams = new URLSearchParams(window.location.search);
      const placeId = parseInt(urlParams.get('id')) || (placesData[0] ? placesData[0].id : 1);
      const place = placesData.find(p => p.id === placeId) || placesData[0];

      if (place) {
        renderDetails(place);
      }
      updatePlanBadge();
    });
  </script>
</body>
</html>
