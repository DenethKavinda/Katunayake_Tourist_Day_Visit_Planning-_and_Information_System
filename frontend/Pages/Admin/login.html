<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - Katunayake Tourist System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full">
    <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center">Admin Access</h2>
    
    <div id="errorAlert" class="hidden p-3 mb-4 bg-red-100 text-red-700 text-xs rounded-xl"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Email</label>
        <input type="email" id="email" required class="w-full border px-4 py-2 rounded-xl text-sm focus:outline-none focus:border-teal-600">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Password</label>
        <input type="password" id="password" required class="w-full border px-4 py-2 rounded-xl text-sm focus:outline-none focus:border-teal-600">
      </div>
      <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 rounded-xl transition">
        Log In
      </button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorAlert = document.getElementById('errorAlert');

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          errorAlert.innerText = data.message || 'Login failed';
          errorAlert.classList.remove('hidden');
          return;
        }

        // Check if user is admin
        if (data.user.role === 'admin') {
          // Store token in localStorage
          localStorage.setItem('adminToken', data.token);
          // Redirect to Admin Dashboard
          window.location.href = '/admin/dashboard.html';
        } else {
          errorAlert.innerText = 'Access denied: Admin permissions required.';
          errorAlert.classList.remove('hidden');
        }
      } catch (err) {
        errorAlert.innerText = 'Unable to connect to backend server.';
        errorAlert.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
